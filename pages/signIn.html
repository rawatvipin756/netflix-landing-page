<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://assets.nflxext.com/us/ffe/siteui/common/icons/nficon2016.ico">
    <title>Netflix</title>
    <link rel="stylesheet" href="../css/signIn.css">
</head>
<body>
    <section class="container">
       <div class="sec">
         <header>
            <img src="../image/logo.svg" alt="logo">
            <hr>
        </header>
        <main class="main">
            <h1>Enter your info to sign in</h1>
            <p class="head-para">Or get started with a new account.</p>
            <form>
                <input type="email" type="number" placeholder="Email or mobile Number">
                <button type="submit">Continue</button>
            </form>
            <h3>Get Help</h3>
            <a href="#">Forgot email or mobile number?</a>
            <a href="#">Learn more about sign-in</a>
            <p class="down">This page is protected by Google reCAPTCHA to ensure you're not a bot.</p>
        </main>
       </div>
        <footer>
             <div class="social">
                <a href="#">Contact Us</a>
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Use</a>
                <a href="#">Help Centre</a>
            </div>
        </footer>
    </section>
</body>
</html>
